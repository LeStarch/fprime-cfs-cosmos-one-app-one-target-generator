[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-cfs-cosmos-generator"
version = "0.1.0"
description = "Generate one standalone cFS COSMOS target bundle for an F Prime application"
requires-python = ">=3.10"
dependencies = [
    "fprime-cosmos @ git+https://github.com/fprime-community/fprime-cosmos.git@59dd8ab33d9a4306592b8853bd5c4cb519f2689e",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
fprime-to-cfs-cosmos-target = "fprime_cfs_cosmos_generator.cli:main"
fprime-cfs-cosmos-merge = "fprime_cfs_cosmos_generator.merge_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fprime_cfs_cosmos_generator = ["runtime/*.rb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "C4", "SIM"]
